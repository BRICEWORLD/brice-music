<!-- =========================
     ARTIST SYSTEM
========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =========================
           ELEMENTS
        ========================= */

        const artistList =
            document.getElementById(
                "artist-list"
            );


        const artistTitle =
            document.getElementById(
                "artist-page-title"
            );


        const artistProfile =
            document.getElementById(
                "artist-profile"
            );


        const artistProfileImage =
            document.getElementById(
                "artist-profile-image"
            );


        const artistProfileName =
            document.getElementById(
                "artist-profile-name"
            );


        const artistProfileDescription =
            document.getElementById(
                "artist-profile-description"
            );


        const artistAlbumsList =
            document.getElementById(
                "artist-albums-list"
            );


        const artistAlbumsTitle =
            document.getElementById(
                "artist-albums-title"
            );


        const artistSongsList =
            document.getElementById(
                "artist-songs-list"
            );


        const artistSongsTitle =
            document.getElementById(
                "artist-songs-title"
            );


        const backArtists =
            document.getElementById(
                "back-artists"
            );



        /* =========================
           DATABASE CHECK
        ========================= */

        if (
            typeof musicDatabase === "undefined"
        ) {

            artistList.innerHTML = `
                <p>
                    اطلاعات موسیقی بارگذاری نشد.
                </p>
            `;

            return;

        }



        const artists =
            musicDatabase.artists || [];


        const albums =
            musicDatabase.albums || [];


        const songs =
            musicDatabase.songs || [];



        /* =========================
           URL PARAMETER
        ========================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const artistId =
            params.get("artist");



        /* =====================================================
           NO ARTIST SELECTED
           ONLY SHOW ARTISTS
        ===================================================== */

        if (!artistId) {


            artistTitle.textContent =
                "خواننده‌های محبوب";


            artistProfile.style.display =
                "none";


            backArtists.style.display =
                "none";


            artistList.style.display =
                "grid";


            artistList.innerHTML = "";



            artists.forEach(
                function (artist) {


                    const card =
                        document.createElement(
                            "a"
                        );


                    card.className =
                        "artist-card";


                    card.href =
                        "artist.html?artist=" +
                        encodeURIComponent(
                            artist.id
                        );


                    card.innerHTML = `

                        <img
                            src="${artist.image}"
                            alt="${artist.name}"
                            loading="lazy"
                        >

                        <h3>
                            ${artist.name}
                        </h3>

                    `;


                    artistList.appendChild(
                        card
                    );

                }
            );


            return;

        }



        /* =====================================================
           FIND ARTIST
        ===================================================== */

        const artist =
            artists.find(
                function (item) {

                    return item.id === artistId;

                }
            );



        /* =========================
           ARTIST NOT FOUND
        ========================= */

        if (!artist) {


            artistTitle.textContent =
                "خواننده پیدا نشد";


            artistList.style.display =
                "none";


            artistProfile.style.display =
                "block";


            artistProfile.innerHTML = `

                <p>
                    خواننده مورد نظر پیدا نشد.
                </p>

            `;

            return;

        }



        /* =====================================================
           ARTIST PROFILE MODE
        ===================================================== */

        document.title =
            "BRICE MUSIC | " +
            artist.name;


        artistTitle.textContent =
            artist.name;


        artistList.style.display =
            "none";


        artistProfile.style.display =
            "block";


        backArtists.style.display =
            "inline-flex";



        /* =========================
           ARTIST INFO
        ========================= */

        artistProfileImage.src =
            artist.image;


        artistProfileImage.alt =
            artist.name;


        artistProfileName.textContent =
            artist.name;


        artistProfileDescription.textContent =
            artist.description ||
            "معرفی و آثار " +
            artist.name;



        /* =====================================================
           FIND ARTIST ALBUMS
        ===================================================== */

        const artistAlbums =
            albums.filter(
                function (album) {

                    return (
                        album.artistId ===
                        artist.id
                    );

                }
            );



        artistAlbumsTitle.textContent =
            "آلبوم‌های " +
            artist.name;


        artistAlbumsList.innerHTML = "";



        /* =========================
           NO ALBUMS
        ========================= */

        if (
            artistAlbums.length === 0
        ) {

            artistAlbumsList.innerHTML = `

                <p>
                    هنوز آلبومی برای این خواننده
                    ثبت نشده است.
                </p>

            `;

        } else {


            /* =========================
               CREATE ALBUM CARDS
            ========================= */

            artistAlbums.forEach(
                function (album) {


                    const card =
                        document.createElement(
                            "a"
                        );


                    card.className =
                        "music-card";


                    card.href =
                        "album.html?album=" +
                        encodeURIComponent(
                            album.id
                        );


                    card.innerHTML = `

                        <div class="music-cover">

                            <img
                                src="${album.cover}"
                                alt="${album.title}"
                                loading="lazy"
                            >

                        </div>


                        <div class="music-info">

                            <h3>
                                ${album.title}
                            </h3>


                            <p>
                                ${artist.name}
                            </p>


                            <p>
                                ${album.year || ""}
                            </p>

                        </div>

                    `;


                    artistAlbumsList.appendChild(
                        card
                    );

                }
            );

        }



        /* =====================================================
           FIND ARTIST SONGS
        ===================================================== */

        const artistSongs =
            songs.filter(
                function (song) {

                    return (
                        song.artistId ===
                        artist.id
                    );

                }
            );



        artistSongsTitle.textContent =
            "آهنگ‌های " +
            artist.name;


        artistSongsList.innerHTML = "";



        /* =========================
           NO SONGS
        ========================= */

        if (
            artistSongs.length === 0
        ) {

            artistSongsList.innerHTML = `

                <p>
                    هنوز آهنگی برای این خواننده
                    ثبت نشده است.
                </p>

            `;

        } else {


            /* =========================
               CREATE SONG CARDS
            ========================= */

            artistSongs.forEach(
                function (song) {


                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "music-card";


                    card.innerHTML = `

                        <div class="music-cover">

                            <img
                                src="${song.cover}"
                                alt="${song.title}"
                                loading="lazy"
                            >


                            <button
                                class="play-button"
                                type="button"
                                aria-label="پخش ${song.title}">

                                ▶

                            </button>

                        </div>


                        <div class="music-info">

                            <h3>
                                ${song.title}
                            </h3>


                            <p>
                                ${artist.name}
                            </p>

                        </div>

                    `;



                    /* =========================
                       PLAY SONG
                    ========================= */

                    const playButton =
                        card.querySelector(
                            ".play-button"
                        );


                    if (playButton) {

                        playButton.addEventListener(
                            "click",
                            function (event) {


                                event.preventDefault();


                                if (
                                    typeof loadSong ===
                                    "function" &&

                                    typeof playSong ===
                                    "function"
                                ) {


                                    loadSong({

                                        ...song,

                                        artist:
                                            artist.name

                                    });


                                    playSong();

                                }

                            }
                        );

                    }



                    artistSongsList.appendChild(
                        card
                    );

                }
            );

        }

    }
);

</script>
