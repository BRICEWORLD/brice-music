<!-- =========================
     ARTIST SYSTEM
========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =========================
           GET URL PARAMETER
        ========================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const artistId =
            params.get("artist");


        const artistList =
            document.getElementById(
                "artist-list"
            );


        const artistHeader =
            document.getElementById(
                "artist-header"
            );


        const artistTitle =
            document.getElementById(
                "artist-page-title"
            );


        const artistSongsSection =
            document.getElementById(
                "artist-songs-section"
            );


        const artistSongsTitle =
            document.getElementById(
                "artist-songs-title"
            );


        const artistSongsList =
            document.getElementById(
                "artist-songs-list"
            );



        /* =========================
           NO ARTIST SELECTED
           SHOW ALL ARTISTS
        ========================= */

        if (!artistId) {


            const artists =
                musicDatabase.artists;


            artistList.innerHTML = "";


            artists.forEach(
                function (artist) {


                    const card =
                        document.createElement(
                            "a"
                        );


                    card.className =
                        "artist-card";


                    card.href =
                        "artist.html?artist=" +
                        encodeURIComponent(
                            artist.id
                        );


                    card.innerHTML = `

                        <img
                            src="${artist.image}"
                            alt="${artist.name}"
                            loading="lazy"
                        >

                        <h3>
                            ${artist.name}
                        </h3>

                    `;


                    artistList.appendChild(
                        card
                    );

                }
            );


            return;

        }



        /* =========================
           FIND SELECTED ARTIST
        ========================= */

        const artist =
            musicDatabase.artists.find(
                function (item) {

                    return item.id === artistId;

                }
            );



        /* =========================
           ARTIST NOT FOUND
        ========================= */

        if (!artist) {


            artistTitle.textContent =
                "خواننده پیدا نشد";


            artistList.innerHTML = `

                <p>
                    خواننده مورد نظر پیدا نشد.
                </p>

            `;


            return;

        }



        /* =========================
           UPDATE PAGE TITLE
        ========================= */

        document.title =
            "BRICE MUSIC | " +
            artist.name;


        artistTitle.textContent =
            artist.name;



        /* =========================
           HIDE ARTIST LIST
        ========================= */

        artistList.style.display =
            "none";



        /* =========================
           FIND ARTIST SONGS
        ========================= */

        const songs =
            musicDatabase.songs.filter(
                function (song) {

                    return (
                        song.artistId ===
                        artist.id
                    );

                }
            );



        /* =========================
           SHOW SONG SECTION
        ========================= */

        artistSongsSection.style.display =
            "block";


        artistSongsTitle.textContent =
            "آهنگ‌های " +
            artist.name;


        artistSongsList.innerHTML = "";



        /* =========================
           NO SONGS
        ========================= */

        if (songs.length === 0) {


            artistSongsList.innerHTML = `

                <p>
                    هنوز آهنگی برای این خواننده
                    ثبت نشده است.
                </p>

            `;


            return;

        }



        /* =========================
           CREATE SONG CARDS
        ========================= */

        songs.forEach(
            function (song) {


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "music-card";


                card.innerHTML = `

                    <div class="music-cover">

                        <img
                            src="${song.cover}"
                            alt="${song.title}"
                            loading="lazy"
                        >

                        <button
                            class="play-button"
                            type="button"
                            aria-label="پخش ${song.title}"
                        >
                            ▶
                        </button>

                    </div>


                    <div class="music-info">

                        <h3>
                            ${song.title}
                        </h3>

                        <p>
                            ${artist.name}
                        </p>

                    </div>

                `;



                /* =========================
                   PLAY SONG
                ========================= */

                const playButton =
                    card.querySelector(
                        ".play-button"
                    );


                playButton.addEventListener(
                    "click",
                    function () {


                        if (
                            typeof loadSong ===
                            "function" &&

                            typeof playSong ===
                            "function"
                        ) {


                            loadSong({

                                ...song,

                                artist:
                                    artist.name

                            });


                            playSong();

                        }

                    }
                );


                artistSongsList.appendChild(
                    card
                );

            }
        );


    }
);

</script>
