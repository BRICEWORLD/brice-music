<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">


<title>
BRICE MUSIC | آلبوم‌ها
</title>


<meta name="description"
      content="جدیدترین آلبوم‌های موسیقی در BRICE MUSIC">


<link rel="stylesheet"
      href="css/style.css">

<link rel="stylesheet"
      href="css/responsive.css">

<link rel="stylesheet"
      href="css/player.css">


<link rel="manifest"
      href="manifest.json">


<link rel="icon"
      type="image/png"
      href="images/favicon.png">


<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap"
      rel="stylesheet">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="site-header">

    <div class="container header-inner">


        <a href="index.html"
           class="logo">

            <span>
                BRICE
            </span>

            <strong>
                MUSIC
            </strong>

        </a>



        <nav class="main-nav">

            <a href="index.html">
                خانه
            </a>


            <a href="music.html">
                آهنگ‌ها
            </a>


            <a href="artist.html">
                خواننده‌ها
            </a>


            <a href="album.html"
               class="active">
                آلبوم‌ها
            </a>


            <a href="category.html">
                دسته‌بندی
            </a>

        </nav>



        <a href="search.html"
           class="search-button">

            🔍

        </a>


    </div>

</header>




<!-- =========================
     MAIN
========================= -->

<main>


<section class="music-section">

    <div class="container">


        <!-- =========================
             ALBUM HEADER
        ========================= -->

        <div class="section-header">

            <div>

                <span class="section-label">
                    Albums
                </span>


                <h1 id="album-page-title">
                    آلبوم‌های موسیقی
                </h1>

            </div>

        </div>



        <!-- =========================
             ALBUM LIST
        ========================= -->

        <div class="music-grid"
             id="album-list">

        </div>


    </div>

</section>


</main>




<!-- =========================
     MUSIC PLAYER
========================= -->

<div class="music-player">

    <div class="container player-inner">


        <div class="player-song">


            <div class="player-cover">

                <img
                    src="images/music/music-01.jpg"
                    alt="BRICE MUSIC">

            </div>


            <div>

                <h4>
                    آهنگ انتخاب نشده
                </h4>


                <span>
                    BRICE MUSIC
                </span>

            </div>


        </div>



        <div class="player-controls">


            <button
                type="button"
                aria-label="آهنگ قبلی">

                ⏮

            </button>


            <button
                class="main-play"
                type="button"
                aria-label="پخش">

                ▶

            </button>


            <button
                type="button"
                aria-label="آهنگ بعدی">

                ⏭

            </button>


        </div>


    </div>

</div>




<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/data.js"></script>

<script src="js/music.js"></script>

<script src="js/player.js"></script>

<script src="js/main.js"></script>



<!-- =========================
     ALBUM SYSTEM
========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =========================
           ELEMENTS
        ========================= */

        const albumList =
            document.getElementById(
                "album-list"
            );


        const albumTitle =
            document.getElementById(
                "album-page-title"
            );



        if (!albumList) {

            return;

        }



        /* =========================
           GET ALBUM ID
        ========================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const albumId =
            params.get("album");



        /* =========================
           GET ALBUMS
        ========================= */

        const albums =
            musicDatabase.albums || [];



        /* =========================
           NO ALBUMS
        ========================= */

        if (albums.length === 0) {

            albumList.innerHTML = `

                <p>
                    هنوز آلبومی ثبت نشده است.
                </p>

            `;

            return;

        }



        /* =========================
           SINGLE ALBUM
        ========================= */

        if (albumId) {


            const album =
                albums.find(
                    function (item) {

                        return item.id === albumId;

                    }
                );



            /* =========================
               ALBUM NOT FOUND
            ========================= */

            if (!album) {

                albumTitle.textContent =
                    "آلبوم پیدا نشد";


                albumList.innerHTML = `

                    <p>
                        آلبوم مورد نظر پیدا نشد.
                    </p>

                `;

                return;

            }



            /* =========================
               FIND ARTIST
            ========================= */

            const artist =
                musicDatabase.artists.find(
                    function (item) {

                        return (
                            item.id ===
                            album.artistId
                        );

                    }
                );



            const artistName =
                artist
                    ? artist.name
                    : "نام خواننده";



            /* =========================
               PAGE TITLE
            ========================= */

            document.title =
                "BRICE MUSIC | " +
                album.title;


            albumTitle.textContent =
                album.title;



            /* =========================
               FIND SONGS
            ========================= */

            const songs =
                musicDatabase.songs.filter(
                    function (song) {

                        return (
                            song.albumId ===
                            album.id
                        );

                    }
                );



            /* =========================
               ALBUM CARD
            ========================= */

            albumList.innerHTML = `

                <article
                    class="music-card album-detail-card">


                    <div class="music-cover">

                        <img
                            src="${album.cover}"
                            alt="${album.title}"
                            loading="lazy"
                        >

                    </div>


                    <div class="music-info">

                        <h3>
                            ${album.title}
                        </h3>


                        <p>
                            ${artistName}
                        </p>


                        <p>
                            ${album.year || ""}
                        </p>

                    </div>


                </article>

            `;



            /* =========================
               ALBUM SONGS
            ========================= */

            if (songs.length > 0) {


                const songsTitle =
                    document.createElement(
                        "div"
                    );


                songsTitle.className =
                    "section-header";


                songsTitle.innerHTML = `

                    <div>

                        <span class="section-label">
                            موسیقی
                        </span>

                        <h2>
                            آهنگ‌های ${album.title}
                        </h2>

                    </div>

                `;


                albumList.appendChild(
                    songsTitle
                );



                songs.forEach(
                    function (song) {


                        const card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "music-card";



                        card.innerHTML = `

                            <div class="music-cover">

                                <img
                                    src="${song.cover}"
                                    alt="${song.title}"
                                    loading="lazy"
                                >


                                <button
                                    class="play-button"
                                    type="button"
                                    aria-label="پخش ${song.title}">

                                    ▶

                                </button>

                            </div>


                            <div class="music-info">

                                <h3>
                                    ${song.title}
                                </h3>


                                <p>
                                    ${artistName}
                                </p>

                            </div>

                        `;



                        const playButton =
                            card.querySelector(
                                ".play-button"
                            );



                        playButton.addEventListener(
                            "click",
                            function () {


                                if (
                                    typeof loadSong ===
                                    "function" &&

                                    typeof playSong ===
                                    "function"
                                ) {


                                    loadSong({

                                        ...song,

                                        artist:
                                            artistName

                                    });


                                    playSong();

                                }

                            }
                        );



                        albumList.appendChild(
                            card
                        );

                    }
                );


            } else {


                const emptyMessage =
                    document.createElement(
                        "p"
                    );


                emptyMessage.textContent =
                    "هنوز آهنگی برای این آلبوم ثبت نشده است.";


                albumList.appendChild(
                    emptyMessage
                );

            }



            return;

        }



        /* =========================
           SHOW ALL ALBUMS
        ========================= */

        albumTitle.textContent =
            "آلبوم‌های موسیقی";


        albumList.innerHTML = "";



        albums.forEach(
            function (album) {


                /* =========================
                   FIND ARTIST
                ========================= */

                const artist =
                    musicDatabase.artists.find(
                        function (item) {

                            return (
                                item.id ===
                                album.artistId
                            );

                        }
                    );



                const artistName =
                    artist
                        ? artist.name
                        : "نام خواننده";



                /* =========================
                   CREATE ALBUM CARD
                ========================= */

                const card =
                    document.createElement(
                        "a"
                    );


                card.className =
                    "music-card";


                card.href =
                    "album.html?album=" +
                    encodeURIComponent(
                        album.id
                    );



                card.innerHTML = `

                    <div class="music-cover">

                        <img
                            src="${album.cover}"
                            alt="${album.title}"
                            loading="lazy"
                        >

                    </div>


                    <div class="music-info">

                        <h3>
                            ${album.title}
                        </h3>


                        <p>
                            ${artistName}
                        </p>

                    </div>

                `;



                albumList.appendChild(
                    card
                );

            }
        );


    }
);

</script>


</body>

</html>
