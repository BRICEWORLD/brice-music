<!-- =========================
     ARTIST SYSTEM
========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const artistList =
            document.getElementById("artist-list");


        if (!artistList) {

            return;

        }


        const artists =
            musicDatabase.artists;


        artistList.innerHTML = "";


        artists.forEach(
            function (artist) {


                const card =
                    document.createElement("a");


                card.className =
                    "artist-card";


                card.href =
                    "artist.html?artist=" +
                    encodeURIComponent(artist.id);


                card.innerHTML = `

                    <img
                        src="${artist.image}"
                        alt="${artist.name}"
                        loading="lazy"
                    >


                    <h3>
                        ${artist.name}
                    </h3>

                `;


                artistList.appendChild(card);

            }
        );

    }
);

</script>
