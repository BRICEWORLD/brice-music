<!-- =========================
     ALBUM SYSTEM
========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const albumList =
            document.getElementById("album-list");


        if (!albumList) {

            return;

        }


        const albums =
            musicDatabase.albums;


        albumList.innerHTML = "";


        if (
            !albums ||
            albums.length === 0
        ) {

            albumList.innerHTML = `

                <p>
                    هنوز آلبومی ثبت نشده است.
                </p>

            `;

            return;

        }


        albums.forEach(
            function (album) {


                const artist =
                    musicDatabase.artists.find(
                        artist =>
                            artist.id === album.artistId
                    );


                const card =
                    document.createElement("article");


                card.className =
                    "music-card";


                card.innerHTML = `

                    <div class="music-cover">

                        <img
                            src="${album.cover}"
                            alt="${album.title}"
                            loading="lazy"
                        >

                    </div>


                    <div class="music-info">

                        <h3>
                            ${album.title}
                        </h3>


                        <p>
                            ${
                                artist
                                    ? artist.name
                                    : "نام خواننده"
                            }
                        </p>

                    </div>

                `;


                albumList.appendChild(card);

            }
        );

    }
);

</script>
