<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/data.js"></script>

<script src="js/music.js"></script>

<script src="js/player.js"></script>

<script src="js/main.js"></script>



<!-- =========================
     ALBUM SYSTEM
========================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =========================
           ELEMENTS
        ========================= */

        const allAlbumsSection =
            document.getElementById(
                "all-albums-section"
            );


        const singleAlbumSection =
            document.getElementById(
                "single-album-section"
            );


        const albumList =
            document.getElementById(
                "album-list"
            );


        const albumHeader =
            document.getElementById(
                "album-header"
            );


        const albumSongsTitle =
            document.getElementById(
                "album-songs-title"
            );


        const albumSongsList =
            document.getElementById(
                "album-songs-list"
            );



        /* =========================
           DATABASE CHECK
        ========================= */

        if (
            typeof musicDatabase ===
            "undefined"
        ) {

            if (albumList) {

                albumList.innerHTML = `

                    <p>
                        دیتابیس موسیقی پیدا نشد.
                    </p>

                `;

            }

            return;

        }



        const albums =
            musicDatabase.albums || [];



        const songs =
            musicDatabase.songs || [];



        const artists =
            musicDatabase.artists || [];



        /* =========================
           URL PARAMETER
        ========================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const albumId =
            params.get("album");



        /* ==================================================
           MODE 1
           ALL ALBUMS
        ================================================== */

        if (!albumId) {


            document.title =
                "BRICE MUSIC | آلبوم‌ها";


            allAlbumsSection.style.display =
                "block";


            singleAlbumSection.style.display =
                "none";


            albumList.innerHTML = "";



            /* =========================
               NO ALBUM
            ========================= */

            if (albums.length === 0) {

                albumList.innerHTML = `

                    <p>
                        هنوز آلبومی ثبت نشده است.
                    </p>

                `;

                return;

            }



            /* =========================
               CREATE ALBUM CARDS
            ========================= */

            albums.forEach(
                function (album) {


                    const artist =
                        artists.find(
                            function (item) {

                                return (
                                    item.id ===
                                    album.artistId
                                );

                            }
                        );


                    const artistName =
                        artist
                            ? artist.name
                            : "نام خواننده";



                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "music-card";


                    card.style.cursor =
                        "pointer";



                    card.innerHTML = `

                        <div class="music-cover">

                            <img
                                src="${album.cover}"
                                alt="${album.title}"
                                loading="lazy"
                            >

                        </div>


                        <div class="music-info">

                            <h3>
                                ${album.title}
                            </h3>


                            <p>
                                ${artistName}
                            </p>


                            <small>
                                ${album.year || ""}
                            </small>

                        </div>

                    `;



                    /* =========================
                       OPEN ALBUM
                    ========================= */

                    card.addEventListener(
                        "click",
                        function () {

                            window.location.href =
                                "album.html?album=" +
                                encodeURIComponent(
                                    album.id
                                );

                        }
                    );


                    albumList.appendChild(
                        card
                    );

                }
            );


            return;

        }



        /* ==================================================
           MODE 2
           SINGLE ALBUM
        ================================================== */

        const album =
            albums.find(
                function (item) {

                    return (
                        item.id ===
                        albumId
                    );

                }
            );



        /* =========================
           ALBUM NOT FOUND
        ========================= */

        if (!album) {


            allAlbumsSection.style.display =
                "none";


            singleAlbumSection.style.display =
                "block";


            albumHeader.innerHTML = `

                <div class="section-header">

                    <div>

                        <span class="section-label">
                            Album
                        </span>

                        <h1>
                            آلبوم پیدا نشد
                        </h1>

                    </div>

                </div>

                <p>
                    آلبوم مورد نظر در دیتابیس پیدا نشد.
                </p>

            `;


            albumSongsList.innerHTML = "";


            return;

        }



        /* =========================
           GET ARTIST
        ========================= */

        const artist =
            artists.find(
                function (item) {

                    return (
                        item.id ===
                        album.artistId
                    );

                }
            );


        const artistName =
            artist
                ? artist.name
                : "نام خواننده";



        /* =========================
           PAGE TITLE
        ========================= */

        document.title =
            "BRICE MUSIC | " +
            album.title;



        /* =========================
           SHOW SINGLE ALBUM
        ========================= */

        allAlbumsSection.style.display =
            "none";


        singleAlbumSection.style.display =
            "block";



        /* =========================
           ALBUM HEADER
        ========================= */

        albumHeader.innerHTML = `

            <div
                class="album-detail"
                style="
                    display:flex;
                    gap:25px;
                    align-items:center;
                    flex-wrap:wrap;
                "
            >

                <div
                    class="music-cover"
                    style="
                        width:220px;
                        max-width:100%;
                    "
                >

                    <img
                        src="${album.cover}"
                        alt="${album.title}"
                        loading="eager"
                    >

                </div>


                <div>

                    <span class="section-label">
                        ALBUM
                    </span>


                    <h1>
                        ${album.title}
                    </h1>


                    <h3>
                        ${artistName}
                    </h3>


                    <p>
                        ${album.description || ""}
                    </p>


                    <p>
                        ${album.year || ""}
                    </p>

                </div>

            </div>

        `;



        /* =========================
           ALBUM SONGS
        ========================= */

        const albumSongs =
            songs.filter(
                function (song) {

                    return (
                        song.albumId ===
                        album.id
                    );

                }
            );



        albumSongsTitle.textContent =
            "آهنگ‌های " +
            album.title;


        albumSongsList.innerHTML = "";



        /* =========================
           NO SONGS
        ========================= */

        if (albumSongs.length === 0) {

            albumSongsList.innerHTML = `

                <p>
                    هنوز آهنگی برای این آلبوم
                    ثبت نشده است.
                </p>

            `;

            return;

        }



        /* =========================
           CREATE SONG CARDS
        ========================= */

        albumSongs.forEach(
            function (song) {


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "music-card";


                card.innerHTML = `

                    <div class="music-cover">

                        <img
                            src="${song.cover}"
                            alt="${song.title}"
                            loading="lazy"
                        >


                        <button
                            class="play-button"
                            type="button"
                            aria-label="پخش ${song.title}"
                        >
                            ▶
                        </button>

                    </div>


                    <div class="music-info">

                        <h3>
                            ${song.title}
                        </h3>


                        <p>
                            ${artistName}
                        </p>

                    </div>

                `;



                /* =========================
                   PLAY SONG
                ========================= */

                const playButton =
                    card.querySelector(
                        ".play-button"
                    );


                playButton.addEventListener(
                    "click",
                    function (event) {


                        event.stopPropagation();


                        if (
                            typeof loadSong ===
                            "function" &&

                            typeof playSong ===
                            "function"
                        ) {


                            loadSong({

                                ...song,

                                artist:
                                    artistName

                            });


                            playSong();

                        }

                    }
                );


                albumSongsList.appendChild(
                    card
                );

            }
        );


    }
);

</script>


</body>

</html>
