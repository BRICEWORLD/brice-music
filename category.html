<script>


// =======================================
// CATEGORY ICONS
// =======================================

const categoryIcons = {

    pop: "🎤",

    rap: "🎧",

    traditional: "🎻",

    rock: "🎸",

    electronic: "⚡",

    fusion: "🎶",

    classical: "🎼",

    sad: "💔",

    romantic: "❤️",

    happy: "🔥",

    nostalgic: "🌙",

    instrumental: "🎹",

    local: "🥁",

    international: "🌍"

};



// =======================================
// RENDER CATEGORIES
// =======================================

function renderCategories() {


    const categoryList =
        document.getElementById("category-list");


    if (!categoryList) {

        return;

    }


    categoryList.innerHTML = "";


    if (
        typeof musicDatabase === "undefined" ||
        !musicDatabase.categories
    ) {

        return;

    }


    musicDatabase.categories.forEach(
        category => {


            const card =
                document.createElement("a");


            card.className =
                "category-card";


            card.href =
                "music.html?category=" +
                encodeURIComponent(category.id);


            const icon =
                categoryIcons[category.id] ||
                "🎵";


            card.innerHTML = `

                <span>
                    ${icon}
                </span>

                <h3>
                    ${category.name}
                </h3>

            `;


            categoryList.appendChild(card);

        }
    );

}



// =======================================
// START
// =======================================

document.addEventListener(
    "DOMContentLoaded",
    renderCategories
);

</script>
